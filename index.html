<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffcccb;
            text-align: center;
        }
        h1 {
            color: #ff1493;
            font-size: 3em;
        }
        button {
            font-size: 1.5em;
            margin: 20px;
            padding: 10px 20px;
            background-color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff69b4;
            color: white;
        }
        .celebration {
            display: none;
            font-size: 2em;
            color: gold;
        }
    </style>
</head>
<body>
    <div>
        <h1>Yasmine, will you be my Valentine?</h1>
        <button id="yesButton1">Yes!</button>
        <button id="yesButton2">Absolutely!</button>
        <div class="celebration" id="celebrationMessage">🎉 Hooray! 🎉</div>
    </div>
    <script>
        const yesButton1 = document.getElementById('yesButton1');
        const yesButton2 = document.getElementById('yesButton2');
        const celebrationMessage = document.getElementById('celebrationMessage');

        yesButton1.addEventListener('click', () => {
            celebrationMessage.style.display = 'block';
        });
        yesButton2.addEventListener('click', () => {
            celebrationMessage.style.display = 'block';
        });
    </script>
</body>
</html>
